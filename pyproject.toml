[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freegem"
version = "2.1.0"
description = "Free Gemini, shaped as the APIs you already use: OpenAI-compatible, Google-native, and MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "freegem contributors" }]
keywords = [
    "gemini",
    "openai",
    "api",
    "proxy",
    "mcp",
    "model-context-protocol",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core has no third-party dependencies: the stdlib server works as-is.
dependencies = []

[project.optional-dependencies]
# True token-by-token streaming. Without it the bridge still works but returns
# the whole reply in one chunk.
streaming = ["httpx>=0.25"]
# The MCP face.
# mcp<2: 2.x renamed FastMCP -> MCPServer
mcp = ["mcp>=1.0,<2"]
# Everything a typical install wants.
full = ["httpx>=0.25", "mcp>=1.0,<2"]
dev = [
    "httpx>=0.25",
    "mcp>=1.0,<2",
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/plokmklo/freegem"
Documentation = "https://github.com/plokmklo/freegem#readme"
Issues = "https://github.com/plokmklo/freegem/issues"

[project.scripts]
freegem = "freegem.cli:main"

[tool.setuptools.packages.find]
include = ["freegem*"]

[tool.setuptools.package-data]
freegem = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7"
testpaths = ["freegem/tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",
]
ignore = [
    "E501",   # line length handled separately
    "B008",   # function calls in defaults are fine here
    "RUF001", # ambiguous unicode: we use em-dashes and arrows in text on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"freegem/tests/*" = ["B017", "SIM"]

[tool.mypy]
# Floor is 3.10: mypy no longer accepts 3.9 as a target, and nothing on this
# machine can test against 3.9 anyway. Raising it is more honest than claiming
# an untested version.
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["mcp.*", "httpx.*"]
ignore_missing_imports = true
