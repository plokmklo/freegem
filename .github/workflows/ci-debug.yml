name: CI Debug

on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

concurrency:
  group: ci-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Capture all gate output
        run: |
          set +e
          {
            echo "=== ruff check ==="
            ruff check . 2>&1
            echo "rc=$?"
            echo "=== ruff format --check ==="
            ruff format --check . 2>&1
            echo "rc=$?"
            echo "=== ruff format --diff (first 500 lines) ==="
            ruff format --diff . 2>&1 | head -500
            echo "=== mypy ==="
            mypy freegem --ignore-missing-imports 2>&1
            echo "rc=$?"
            echo "=== pytest (no mcp) ==="
            pytest -q 2>&1
            echo "rc=$?"
            echo "=== install mcp, mcp-dependent tests ==="
            python -m pip install mcp 2>&1 | tail -2
            pytest freegem/tests/test_web_research_contract.py freegem/tests/test_tools.py -q 2>&1
            echo "rc=$?"
            echo "=== END ==="
          } > ci-debug-output.txt 2>&1
          exit 0

      - name: Surface output as annotations
        if: always()
        run: head -20 ci-debug-output.txt | while IFS= read -r line; do echo "::error title=ci-debug::$line"; done

      - name: Commit output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-debug-output.txt
          git commit -m "ci-debug: capture gate output [skip ci]" || echo "nothing to commit"
          git push
