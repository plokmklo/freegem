name: CI debug capture

on:
  push:
    branches: [improvements]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Capture all gates
        shell: bash
        run: |
          set +e
          {
            echo "# ruff check"
            ruff check . 2>&1
            echo "ruff_check_exit=$?"
            echo
            echo "# ruff format --check"
            ruff format --check . 2>&1
            echo "ruff_format_exit=$?"
            echo
            echo "# mypy"
            mypy freegem --ignore-missing-imports 2>&1
            echo "mypy_exit=$?"
            echo
            echo "# pytest"
            pytest -q --tb=short 2>&1 | tail -n 300
            echo "pytest_exit=${PIPESTATUS[0]}"
          } > ci_debug_output.txt 2>&1
          tail -n 40 ci_debug_output.txt
      - name: Commit output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_debug_output.txt
          git commit -m "chore: capture CI gate output for debugging [skip ci]" || echo "no changes"
          git push
