name: ci-debug

on:
  push:
    branches: [ci-debug]

permissions:
  contents: write

jobs:
  dump-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Collect
        run: |
          pytest --collect-only -q > pytest-out.txt 2>&1
          echo "collect exit=$?" >> pytest-out.txt

      - name: Test
        run: |
          pytest -q -x --cov=freegem --cov-report=term-missing >> pytest-out.txt 2>&1
          echo "pytest exit=$?" >> pytest-out.txt

      - name: Commit output
        run: |
          git config user.name "ci-debug-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pytest-out.txt
          git commit -m "ci-debug output [skip ci]"
          git push
