name: ci-fix (temporary)

on:
  push:
    branches: [improvements]

permissions:
  contents: write

concurrency:
  group: ci-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply ruff autofixes and formatting
        run: |
          ruff check --fix . || echo "non-autofixable findings remain"
          ruff format .
      - name: Commit formatted tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to fix"
            exit 0
          fi
          git commit -m "style: apply ruff autofixes and formatting [skip ci]"
          git push origin HEAD:improvements
