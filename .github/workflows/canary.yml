name: canary

# Daily breakage canary. This project talks to an unversioned web endpoint and
# scrapes live sites, so the most likely failure mode is not a code change --
# it is Google changing something, a site changing its robots/HTML, or a
# dependency drifting. The regular CI cannot catch that (it only runs on push
# and never touches the network); this canary does, once a day.
#
# Everything here runs WITHOUT credentials: the bridge itself is exercised
# anonymously (doctor), the scraper end-to-end against a stable page, and the
# SSRF guard's refusal behavior. A red canary means "something upstream moved;
# look here first", even when no commit touched the repo.

on:
  schedule:
    # Daily at 07:23 UTC -- an off-the-hour minute so it does not collide with
    # the top-of-hour CI rush on GitHub runners.
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Doctor (endpoint reachability, build tag, model resolution)
        run: freegem doctor

      - name: Scrape end-to-end (SSRF guard, fetch, HTML extraction)
        run: |
          freegem scrape https://example.com | tee /tmp/scrape.out
          grep -q "UNTRUSTED WEB CONTENT" /tmp/scrape.out
          grep -q "Example Domain" /tmp/scrape.out

      - name: Scrape honors robots.txt
        run: |
          # facebook.com disallows all crawlers; the scrape must refuse.
          if freegem scrape https://www.facebook.com/ >/tmp/robots.out 2>&1; then
            echo "robots.txt was ignored:"; cat /tmp/robots.out; exit 1
          fi
          grep -q "robots.txt disallows" /tmp/robots.out

      - name: SSRF guard refuses loopback
        run: |
          if freegem scrape http://127.0.0.1:9/ >/tmp/ssrf.out 2>&1; then
            echo "SSRF guard failed to refuse loopback:"; cat /tmp/ssrf.out; exit 1
          fi
          grep -q "SSRF guard refused" /tmp/ssrf.out

      - name: SSRF guard refuses link-local metadata address
        run: |
          if freegem scrape http://169.254.169.254/latest/meta-data/ >/tmp/ssrf2.out 2>&1; then
            echo "SSRF guard failed to refuse metadata IP:"; cat /tmp/ssrf2.out; exit 1
          fi
          grep -q "SSRF guard refused" /tmp/ssrf2.out
